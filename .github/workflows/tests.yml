name: "✅ Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backend unit tests
        run: python3 -m unittest tests.test_fetch_papers -v

      - name: Run frontend smoke test
        run: node tests/frontend_smoke.js

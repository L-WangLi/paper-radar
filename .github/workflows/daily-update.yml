name: "🛰️ Paper Radar Daily Update"

on:
  schedule:
    # Run at 00:00 UTC daily (08:00 Beijing Time)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: "paper-radar"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get UTC date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          # Each cache entry's items are themselves keyed by UTC date internally
          # (see get_cache/set_cache in fetch_papers.py), so a cache saved under a
          # given date can only ever produce hits for reruns on that same date.
          # Keying the Actions cache by date too means same-day reruns actually
          # reuse it, instead of every run_number minting a brand-new cache entry
          # that piles up until GitHub's 10GB-per-repo limit starts evicting them.
          key: paper-cache-${{ steps.date.outputs.date }}
          restore-keys: |
            paper-cache-

      - name: Fetch papers
        run: python scripts/fetch_papers.py

      - name: Summarize papers (GitHub Models)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/summarize_papers.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Send WeChat daily push
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/send_wechat.py

      - name: Commit data updates
        run: |
          git config user.name "Paper Radar Bot"
          git config user.email "bot@paper-radar"
          git add data/latest.json data/index.json
          if [ -f data/pushed_history.json ]; then git add data/pushed_history.json; fi
          git diff --staged --quiet || git commit -m "📡 Update papers $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
